; Legges etter www.conf og overstyrer den.
[www]
; PHP-FPM tømmer ellers miljøvariablene, og da ser ikke appen OPENSCAD_BIN,
; MPLUS_RETURN_HOSTS og de andre innstillingene i docker-compose.yml.
clear_env = no
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
request_terminate_timeout = 150s

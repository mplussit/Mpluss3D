# M+ 3D bak HAProxy. HAProxy tar seg av HTTPS og komprimering.
server {
    listen 80;
    server_name _;
    root /var/www/mplus3d/public;
    index index.php;

    client_max_body_size 2m;
    server_tokens off;

    # php-fpm slås opp ved hver forespørsel (Dockers DNS), så nginx starter selv om
    # PHP-containeren ikke er klar ennå, og finner den igjen etter en omstart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm php-fpm:9000;

    # Bare public/ er webrot. Skjulte filer (.htaccess o.l.) vises aldri.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass $php_fpm;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        # OpenSCAD kan bruke opptil 60 s, pluss kø.
        fastcgi_read_timeout 150s;
    }

    # Ingen lang hurtigbufring av statiske filer: JS-moduler som importeres av andre
    # moduler, har ikke versjonsnummer i adressen (?v=), og må hentes på nytt etter
    # en oppdatering.
}
